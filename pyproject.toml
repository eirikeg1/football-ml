[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-ml"
version = "0.1.0"
description = "Modular football statistics prediction pipeline"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "pyyaml>=6.0",
    "dacite>=1.8",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
search = [
    "matplotlib>=3.8",
]

[project.scripts]
football-ml-train = "football_ml.cli.train:main"
football-ml-test-eval = "football_ml.cli.test_eval:main"
football-ml-leaderboard = "football_ml.search.leaderboard:main"
football-ml-report = "football_ml.search.report:main"
football-ml-multi-seed = "football_ml.search.multi_seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: smoke tests (forward pass sanity checks)",
    "integration: integration tests (multi-module combinations)",
]
